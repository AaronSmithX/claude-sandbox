<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tile Runner — 3D Browser Game</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23ffb347'/></svg>"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1020;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      canvas {
        display: block;
      }
      #hint {
        position: fixed;
        left: 16px;
        bottom: 16px;
        padding: 10px 14px;
        border-radius: 10px;
        background: rgba(10, 16, 32, 0.6);
        color: #dfe7ff;
        font-size: 14px;
        line-height: 1.5;
        letter-spacing: 0.2px;
        backdrop-filter: blur(6px);
        border: 1px solid rgba(120, 150, 220, 0.25);
        user-select: none;
        pointer-events: none;
      }
      #hint b {
        color: #8fb4ff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hint">
      Move with <b>WASD</b> or <b>arrow keys</b> — one tile at a time.
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
