<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Tile Runner — 3D Browser Game</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23ffb347'/></svg>"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #0b1020;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        /* No scrolling, pinch-zoom or pull-to-refresh stealing our touches. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: block;
      }
      canvas {
        display: block;
      }
      /* Shared glass-panel look for every overlay. */
      #hint,
      #hud,
      .overlay-panel {
        background: rgba(10, 16, 32, 0.6);
        border: 1px solid rgba(120, 150, 220, 0.25);
        backdrop-filter: blur(6px);
        color: #dfe7ff;
      }
      #hint {
        position: fixed;
        left: 16px;
        bottom: 16px;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 14px;
        line-height: 1.5;
        letter-spacing: 0.2px;
        max-width: min(420px, calc(100vw - 32px));
        user-select: none;
        pointer-events: none;
        transition: opacity 500ms ease;
      }
      #hint b {
        color: #8fb4ff;
      }
      /* The keyboard hint sits bottom-left, which is where the D-pad lands on a
         narrow screen — tuck it under the HUD once touch mode is on. */
      body.touch-mode #hint {
        top: calc(74px + env(safe-area-inset-top));
        bottom: auto;
      }
      /* Once you're moving, you don't need to be told how to move. */
      body.has-moved #hint {
        opacity: 0;
      }

      /* --- Inventory HUD -------------------------------------------------- */
      #hud {
        position: fixed;
        top: calc(14px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        padding: 8px 10px;
        border-radius: 14px;
        pointer-events: none;
        user-select: none;
      }
      .hud-chip {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px 6px;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.04);
        opacity: 0.25;
        filter: grayscale(1);
        transition:
          opacity 220ms ease,
          filter 220ms ease;
      }
      .hud-chip.is-held {
        opacity: 1;
        filter: none;
      }
      .hud-chip svg {
        width: 22px;
        height: 22px;
        display: block;
      }
      .chip-count {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .chip-count:empty {
        display: none;
      }

      /* --- Win / game-over overlays --------------------------------------- */
      .overlay {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        padding: 24px;
        background: rgba(6, 10, 22, 0.72);
        z-index: 10;
      }
      .overlay.is-shown {
        display: grid;
      }
      .overlay-panel {
        padding: 28px 32px;
        border-radius: 18px;
        text-align: center;
        max-width: 320px;
      }
      .overlay h1 {
        font-size: 22px;
        margin-bottom: 8px;
      }
      .overlay p {
        font-size: 14px;
        line-height: 1.5;
        color: #aab8dd;
        margin-bottom: 20px;
      }
      .overlay button {
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        color: #0b1020;
        background: #8fb4ff;
        border: 0;
        border-radius: 11px;
        padding: 12px 26px;
        min-height: 44px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .overlay button:active {
        transform: scale(0.97);
      }
      /* Game over gets a warmer button so the two overlays read differently. */
      #try-again {
        background: #ff9d7a;
      }
      body.touch-mode .keyboard-hint,
      body:not(.touch-mode) .touch-hint {
        display: none;
      }

      /* --- On-screen D-pad ---------------------------------------------- */
      #touch-controls {
        --btn: 68px;
        position: fixed;
        left: 50%;
        bottom: calc(20px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: none;
        grid-template-columns: repeat(3, var(--btn));
        grid-template-rows: repeat(3, var(--btn));
        gap: 8px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      body.touch-mode #touch-controls {
        display: grid;
      }
      .dpad-btn {
        display: grid;
        place-items: center;
        padding: 0;
        border-radius: 16px;
        border: 1px solid rgba(120, 150, 220, 0.35);
        background: rgba(10, 16, 32, 0.6);
        backdrop-filter: blur(6px);
        color: #dfe7ff;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        cursor: pointer;
        transition:
          background 90ms ease,
          transform 90ms ease;
      }
      .dpad-btn svg {
        width: 40%;
        height: 40%;
        fill: currentColor;
      }
      .dpad-btn.is-pressed {
        background: rgba(143, 180, 255, 0.4);
        transform: scale(0.94);
      }
      .dpad-btn[data-move='up'] {
        grid-area: 1 / 2;
      }
      .dpad-btn[data-move='left'] {
        grid-area: 2 / 1;
      }
      .dpad-btn[data-move='left'] svg {
        transform: rotate(-90deg);
      }
      .dpad-btn[data-move='right'] {
        grid-area: 2 / 3;
      }
      .dpad-btn[data-move='right'] svg {
        transform: rotate(90deg);
      }
      .dpad-btn[data-move='down'] {
        grid-area: 3 / 2;
      }
      .dpad-btn[data-move='down'] svg {
        transform: rotate(180deg);
      }
      /* Landscape phones are short: tuck the pad into the bottom-right corner
         so it sits under a thumb instead of covering the middle of the map. */
      @media (orientation: landscape) and (max-height: 520px) {
        #touch-controls {
          --btn: 58px;
          left: auto;
          right: calc(20px + env(safe-area-inset-right));
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud" aria-label="Inventory"></div>

    <div id="hint">
      <span class="keyboard-hint">
        Move with <b>WASD</b> or <b>arrow keys</b> — one tile at a time.
      </span>
      <span class="touch-hint">Tap or hold the <b>arrows</b> to move.</span>
    </div>

    <div id="touch-controls" aria-hidden="true">
      <button class="dpad-btn" data-move="up" type="button" aria-label="Move up">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5.5 20 18.5H4z" />
        </svg>
      </button>
      <button
        class="dpad-btn"
        data-move="left"
        type="button"
        aria-label="Move left"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5.5 20 18.5H4z" />
        </svg>
      </button>
      <button
        class="dpad-btn"
        data-move="right"
        type="button"
        aria-label="Move right"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5.5 20 18.5H4z" />
        </svg>
      </button>
      <button
        class="dpad-btn"
        data-move="down"
        type="button"
        aria-label="Move down"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5.5 20 18.5H4z" />
        </svg>
      </button>
    </div>
    <div id="win" class="overlay">
      <div class="overlay-panel">
        <h1>You found the star!</h1>
        <p>Keys turned, columns dropped, water crossed. Level complete.</p>
        <button id="play-again" type="button">Play again</button>
      </div>
    </div>

    <div id="gameover" class="overlay">
      <div class="overlay-panel">
        <h1>Game over</h1>
        <p>One of the spiked shells got you. The level resets from the start.</p>
        <button id="try-again" type="button">Try again</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
